inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 140

# The specs deliberately share many `let`s, group several expectations per example, mix `have_received`
# and `receive`, stub with `allow_any_instance_of` for the HTTP helpers, and build configs from OpenStruct
# (as Config does). These cops would force a rewrite of the suite for no behavior gain.
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/NestedGroups:
  Enabled: false
RSpec/MessageSpies:
  Enabled: false
RSpec/AnyInstance:
  Enabled: false
RSpec/IndexedLet:
  Enabled: false
RSpec/ReceiveMessages:
  Enabled: false
RSpec/VerifiedDoubles:
  Enabled: false
RSpec/SubjectStub:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/ExpectOutput:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false

# Config parses the JSON config into OpenStruct on purpose (dot access to nested settings)
Style/OpenStructUse:
  Enabled: false
